[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-time-machine"
version = "0.1.0"
description = "Local, read-only software archaeology foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "networkx>=3.4,<4",
  "celery[redis]>=5.4,<6", "redis>=5.2,<7", "pgvector>=0.3,<1",
  "tree-sitter==0.25.2", "tree-sitter-language-pack==0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-networkx>=3.4,<4"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["app.tests*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = ["integration: needs migrated PostgreSQL via TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/0008_local_ai_rag.py" = ["E501"]
"app/api/routes/ai.py" = ["E501"]
"app/services/ai/*.py" = ["E501"]
"app/tests/test_ai_phase6.py" = ["E501"]
"alembic/versions/0010_architecture_evolution.py" = ["E501"]
"app/api/routes/architecture_history.py" = ["E501"]
"app/services/architecture_history/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
exclude = ["app/tests/"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
